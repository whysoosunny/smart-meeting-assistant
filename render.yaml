# Configure the three provider credentials securely during Blueprint setup.
# The web service is free; the assistant worker uses paid compute.
services:
  - type: web
    name: sunny-smart-meeting-web
    runtime: node
    plan: free
    rootDir: frontend
    branch: main
    buildCommand: npm ci --legacy-peer-deps && npm run build
    startCommand: npm start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_STREAM_API_KEY
        sync: false
      - key: STREAM_API_KEY
        sync: false
      - key: STREAM_API_SECRET
        sync: false
      - key: NEXT_PUBLIC_CALL_ID
        value: sunny-meeting
  - type: worker
    name: sunny-smart-meeting-assistant
    runtime: python
    plan: 0.5c-512mb
    rootDir: backend
    branch: main
    buildCommand: uv sync --frozen
    startCommand: uv run --no-sync python main.py
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: STREAM_API_KEY
        fromService:
          name: sunny-smart-meeting-web
          type: web
          envVarKey: STREAM_API_KEY
      - key: STREAM_API_SECRET
        fromService:
          name: sunny-smart-meeting-web
          type: web
          envVarKey: STREAM_API_SECRET
      - key: GOOGLE_API_KEY
        sync: false
      - key: CALL_ID
        value: sunny-meeting
