# Free web application only. Run the Python assistant locally.
services:
  - type: web
    name: sunny-smart-meeting-web
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: cd frontend && npm ci --legacy-peer-deps && npm run build
    startCommand: cd frontend && exec npm start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_STREAM_API_KEY
        sync: false
      - key: STREAM_API_KEY
        sync: false
      - key: STREAM_API_SECRET
        sync: false
      - key: NEXT_PUBLIC_CALL_ID
        value: sunny-meeting

